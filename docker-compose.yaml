services:

  app_first:
    build:
      context: .
      dockerfile: app_first/Dockerfile
    env_file:
      - .env
    ports:
      - "8081:8000"
    volumes:
      - ./app_first:/app


  app_second:
    build:
      context: .
      dockerfile: app_second/Dockerfile
    env_file:
      - .env
    ports:
      - "8082:8000"
    volumes:
      - ./app_second:/app

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file:
     - .env
      


  my_broker:
    image: rabbitmq:3-management
    container_name: my_rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
     - rabbitmq_data:/var/lib/rabbitmq
    restart: always

volumes:
  rabbitmq_data: 